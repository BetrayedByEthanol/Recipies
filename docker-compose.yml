services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_PATH: /data/recipes.db
      CLIENT_ORIGIN: http://localhost
      # Uncomment and set to protect write routes (POST/PUT/DELETE).
      # If unset, all routes are open (suitable for local/trusted networks).
      # ADMIN_TOKEN: your-secret-token
    volumes:
      - recipes-data:/data
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  recipes-data:
