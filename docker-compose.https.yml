services:
  proxy:
    image: caddy:2
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-recipes.home.arpa}    
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - client

  client:
    ports: []
    expose:
      - "80"

  server:
    environment:
      CLIENT_ORIGIN: ${APP_ORIGIN:-https://recipes.home.arpa}

volumes:
  caddy-data:
  caddy-config:

