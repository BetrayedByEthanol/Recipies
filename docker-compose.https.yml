services:
  proxy:
    image: nginx:1.25-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-recipes.home.arpa}
      TLS_CERT_NAME: ${TLS_CERT_NAME:-recipes.home.arpa}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/templates/https.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - client

  client:
    ports: []
    expose:
      - "80"

  server:
    environment:
      CLIENT_ORIGIN: ${APP_ORIGIN:-https://recipes.home.arpa}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      
