name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PNPM_VERSION: 9

jobs:
  server:
    name: Server — typecheck, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Full install (no --ignore-scripts) so better-sqlite3 compiles its
      # native binding on the CI runner. Build tools (python3/make/g++) are
      # available on ubuntu-latest by default.
      - run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @recipes/shared run build

      - run: pnpm --filter recipes-server run typecheck
      - run: pnpm --filter recipes-server run lint
      - run: pnpm --filter recipes-server run test

  client:
    name: Client — typecheck, lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @recipes/shared run build

      - run: pnpm --filter recipes-client run typecheck
      - run: pnpm --filter recipes-client run lint
      - run: pnpm --filter recipes-client run build

  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4

      - name: Build and start Docker stack
        run: docker compose up -d --build

      - name: Show container status
        run: docker compose ps

      - name: Check frontend and API through nginx
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost/ -o /tmp/index.html \
              && grep -q '<div id="root"></div>' /tmp/index.html \
              && grep -q '/assets/' /tmp/index.html \
              && (curl -fsS http://localhost/manifest.webmanifest -o /tmp/manifest.json || curl -fsS http://localhost/manifest.json -o /tmp/manifest.json) \
              && node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('/tmp/manifest.json','utf8'));" \
              && curl -fsS http://localhost/pwa-192x192.png -o /tmp/pwa-192x192.png \
              && curl -fsS http://localhost/pwa-512x512.png -o /tmp/pwa-512x512.png \
              && curl -fsS http://localhost/api/recipes > /dev/null; then
              echo "Docker smoke test passed"
              exit 0
            fi
            docker compose ps
            sleep 2
          done
          echo "Docker smoke test failed"
          docker compose logs
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v

